<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetShop Pro - Quản Lý Thú Cưng (CRUD)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4" href="index.html">
                <i class="fa-solid fa-paw text-warning"></i> PetShop <span class="text-warning">Pro</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html"><i class="fa-solid fa-house me-1"></i> Trang Chủ</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="products.html"><i class="fa-solid fa-store me-1"></i> Sản Phẩm</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="admin.html"><i class="fa-solid fa-screwdriver-wrench me-1"></i> Quản Lý (CRUD)</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center">
                    <a href="cart.html" class="btn btn-warning text-white fw-bold position-relative px-3 rounded-pill shadow-sm text-decoration-none">
                        <i class="fa-solid fa-cart-shopping me-1"></i> Giỏ Hàng
                        <span id="cart-badge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Toast Thông Báo -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1080;">
        <div id="liveToast" class="toast align-items-center text-white bg-success border-0 shadow-lg" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body fw-bold" id="toast-message">Thao tác thành công!</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <!-- Nội dung Quản lý CRUD -->
    <div class="container my-4 content-section">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
            <h2 class="fw-bold m-0"><i class="fa-solid fa-screwdriver-wrench text-warning me-2"></i> Quản Lý Sản Phẩm (CRUD)</h2>
            <button id="btn-reset-default" class="btn btn-outline-danger rounded-pill px-3 fw-bold btn-sm">
                <i class="fa-solid fa-rotate-left me-1"></i> Khôi Phục Dữ Liệu Gốc
            </button>
        </div>

        <div class="row g-4">
            <!-- Cột Form Thêm / Sửa -->
            <div class="col-lg-4">
                <div class="card border-0 shadow-sm rounded-4 p-4 bg-white sticky-lg-top" style="top: 85px;">
                    <h4 class="fw-bold mb-3 border-bottom pb-2" id="form-title">
                        <i class="fa-solid fa-plus-circle text-success me-1"></i> Thêm Thú Cưng Mới
                    </h4>
                    <form id="product-form">
                        <input type="hidden" id="pet-id">

                        <div class="mb-3">
                            <label class="form-label fw-bold">Tên thú cưng <span class="text-danger">*</span></label>
                            <input type="text" id="pet-name" class="form-control rounded-3" placeholder="VD: Chó Shiba Inu Thuần Chủng" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Danh mục <span class="text-danger">*</span></label>
                                <select id="pet-category" class="form-select rounded-3" required>
                                    <option value="Cho">Chó Cảnh</option>
                                    <option value="Meo">Mèo Cảnh</option>
                                    <option value="Hamster">Hamster</option>
                                    <option value="Chim">Chim Cảnh</option>
                                    <option value="Ca">Cá Cảnh</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Giá bán (VNĐ) <span class="text-danger">*</span></label>
                                <input type="number" id="pet-price" class="form-control rounded-3" placeholder="VD: 4500000" min="1000" required>
                            </div>
                        </div>

                        <div class="mb-2">
                            <label class="form-label fw-bold">Chọn nhanh ảnh mẫu thực tế</label>
                            <select id="sample-img-select" class="form-select form-select-sm rounded-3 text-secondary">
                                <option value="">-- Hoặc tự dán URL ảnh bên dưới --</option>
                                <option value="https://images.unsplash.com/photo-1583511655857-d19b40a7a54e?auto=format&fit=crop&w=600&q=80">Ảnh Chó Shiba Inu</option>
                                <option value="https://images.unsplash.com/photo-1537151608828-ea2b11777ee8?auto=format&fit=crop&w=600&q=80">Ảnh Chó Pug Mặt Xệ</option>
                                <option value="https://images.unsplash.com/photo-1533738363-b7f9aef128ce?auto=format&fit=crop&w=600&q=80">Ảnh Mèo Vàng Đeo Kính</option>
                                <option value="https://images.unsplash.com/photo-1548767797-d8c844163c4c?auto=format&fit=crop&w=600&q=80">Ảnh Hamster Trắng</option>
                                <option value="https://images.unsplash.com/photo-1552728089-57bdde30beb3?auto=format&fit=crop&w=600&q=80">Ảnh Vẹt Đầy Màu Sắc</option>
                                <option value="https://images.unsplash.com/photo-1524704654690-b56c05c78a00?auto=format&fit=crop&w=600&q=80">Ảnh Cá Vàng Thủy Sinh</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">URL Hình ảnh thực tế <span class="text-danger">*</span></label>
                            <input type="url" id="pet-img" class="form-control rounded-3" placeholder="https://images.unsplash.com/..." required>
                            <div class="mt-2 text-center">
                                <img id="img-preview" src="https://images.unsplash.com/photo-1583511655857-d19b40a7a54e?auto=format&fit=crop&w=600&q=80" alt="Preview" class="rounded-3 shadow-sm border" style="height: 120px; width: 100%; object-fit: cover;">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Mô tả chi tiết <span class="text-danger">*</span></label>
                            <textarea id="pet-desc" class="form-control rounded-3" rows="3" placeholder="Mô tả đặc điểm, tính cách, tiêm phòng..." required></textarea>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" id="btn-submit-form" class="btn btn-warning text-white fw-bold flex-grow-1 rounded-pill py-2 shadow-sm">
                                <i class="fa-solid fa-floppy-disk me-1"></i> Lưu Thú Cưng
                            </button>
                            <button type="button" id="btn-cancel-edit" class="btn btn-secondary fw-bold rounded-pill px-3 py-2" style="display: none;">
                                Hủy
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Cột Bảng Danh Sách Sản Phẩm -->
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
                    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
                        <h5 class="fw-bold m-0">Danh Sách Hiện Có (<span id="admin-total-count" class="text-danger">0</span>)</h5>
                        <input type="text" id="admin-search" class="form-control form-control-sm rounded-pill w-auto px-3" placeholder="Tìm nhanh trong bảng...">
                    </div>
                    <div class="table-responsive">
                        <table class="table align-middle table-hover">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Hình Ảnh</th>
                                    <th>Tên Thú Cưng</th>
                                    <th>Danh Mục</th>
                                    <th>Giá Bán</th>
                                    <th class="text-center">Hành Động</th>
                                </tr>
                            </thead>
                            <tbody id="admin-product-tbody">
                                <!-- Render bằng crud.js -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
