<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetShop Pro - Chi Tiết Thú Cưng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4" href="index.html">
                <i class="fa-solid fa-paw text-warning"></i> PetShop <span class="text-warning">Pro</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>



            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html"><i class="fa-solid fa-house me-1"></i> Trang Chủ</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="products.html"><i class="fa-solid fa-store me-1"></i> Sản Phẩm</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="admin.html"><i class="fa-solid fa-screwdriver-wrench me-1"></i> Quản Lý (CRUD)</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center">
                    <a href="cart.html" class="btn btn-warning text-white fw-bold position-relative px-3 rounded-pill shadow-sm text-decoration-none">
                        <i class="fa-solid fa-cart-shopping me-1"></i> Giỏ Hàng
                        <span id="cart-badge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Toast Thông Báo -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1080;">
        <div id="liveToast" class="toast align-items-center text-white bg-success border-0 shadow-lg" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body fw-bold" id="toast-message">Đã thêm vào giỏ hàng!</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <!-- Nội dung Chi Tiết Sản Phẩm -->
    <div class="container my-4 content-section">
        <div class="mb-4">
            <a href="products.html" class="btn btn-outline-secondary rounded-pill px-4 fw-bold shadow-sm">
                <i class="fa-solid fa-arrow-left me-2"></i> Quay Lại Cửa Hàng
            </a>
        </div>

        <div class="card shadow-sm border-0 rounded-4 p-4 bg-white mb-5">
            <div class="row align-items-center" id="product-detail-content">
                <!-- Render tự động bằng ui.js -->
            </div>
        </div>

        <!-- Sản phẩm liên quan -->
        <h4 class="fw-bold text-dark mb-4"><i class="fa-solid fa-heart text-danger me-2"></i> Thú Cưng Cùng Danh Mục</h4>
        <div class="row" id="related-products"></div>
    </div>

    <footer class="bg-dark text-white text-center py-4 mt-5">
        <div class="container">
            <p class="mb-0 fw-medium">© 2026 <strong>PetShop Pro</strong> - Hệ thống Cửa hàng Thú cưng Uy tín.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
